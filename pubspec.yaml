name: limitless_code_template
description: "Limitless Code Template"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cached_network_image: ^4.0.6
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_flavorizr: ^2.6.0
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  fluttertoast: ^10.0.2
  get_it: ^9.3.0
  go_router: ^18.1.4
  injectable: ^3.0.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  lottie: ^3.8.2
  meta: ^1.19.0
  permission_handler: ^13.0.2
  persistent_bottom_nav_bar_v2: ^6.5.0
  pinput: ^6.0.2
  pretty_dio_logger: ^1.4.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  smart_auth: ^4.0.0
  vector_graphics: ^1.3.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mockito: ^5.8.1
  rename: ^3.1.0
  vector_graphics_compiler: ^1.3.6
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/lotties/
    - assets/rasters/
    # SVGs are compiled to vector_graphics binaries at build time
    # (loaded with AppVectorImage / AssetBytesLoader).
    - path: assets/vectors/
      transformers:
        - package: vector_graphics_compiler

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Variable font (wght 400–900); only used by the Diva Courier wordmark.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf

flutter_assets:
  assets_path:
    - assets/rasters/
    - assets/vectors/
    - assets/fonts/
    - assets/lotties/
  output_path: lib/core/constants
  filename: assets.dart
  field_prefix: null
flutter_intl:
  enabled: true
